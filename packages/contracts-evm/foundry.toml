# foundry.toml
# echidna/foundry sibling layout. hardhat remains the primary test runner;
# this exists so echidna 2.x can find a compilable solidity project for
# property-based fuzzing of the wave H contracts.

[profile.default]
src = "contracts"
out = "out-foundry"
libs = ["node_modules", "lib"]
test = "test-echidna"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# alt profile: drop viaIR if echidna hangs on the IR pipeline.
[profile.no_via_ir]
via_ir = false

# wave M+N invariant profile: targets foundry-native invariant suites under
# test/foundry/. Run via `FOUNDRY_PROFILE=invariants forge test`.
[profile.invariants]
src = "contracts"
out = "out-foundry"
libs = ["node_modules", "lib"]
test = "test/foundry"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[profile.invariants.fuzz]
runs = 10000

[profile.invariants.invariant]
runs = 256
depth = 64
fail_on_revert = false

# zodiac profile: native-value-ceiling checker unit + BSC-fork integration tests
# under test/foundry/zodiac/. The fork test deploys a real Roles v2 module proxy
# off the canonical BSC mastercopy and proves the per-call value ceiling reverts
# above-cap calls. Run:
#   FOUNDRY_PROFILE=zodiac forge test                       # unit tests only (fork tests vm.skip off-chain)
#   FOUNDRY_PROFILE=zodiac forge test --fork-url $BSC_RPC_URL  # incl. real Roles v2 fork proof
[profile.zodiac]
src = "contracts"
out = "out-foundry"
libs = ["node_modules", "lib"]
test = "test/foundry/zodiac"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# via_ir required: sibling repo contracts (e.g. BundleRouter) hit stack-too-deep
# without the IR pipeline. The zodiac tests themselves are small; the cost is
# the one-time full-repo IR compile (cached afterwards).
via_ir = true
auto_detect_solc = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[profile.zodiac.fuzz]
runs = 4096
