name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run waifu-core:lint:all

      - name: Typecheck
        run: bun run waifu-core:typecheck

      - name: Test
        run: bun run waifu-core:test

      - name: Build
        run: bun run waifu-core:build
