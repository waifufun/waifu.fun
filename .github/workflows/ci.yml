name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'apps/frontend/public/skill.md'
      - 'AGENT.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - 'README.md'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'apps/frontend/public/skill.md'
      - 'AGENT.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      contracts: ${{ steps.filter.outputs.contracts }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/brain/**'
              - 'apps/bundle-bot/**'
              - 'apps/evm-indexer/**'
              - 'apps/launch-indexer/**'
              - 'apps/mcp/**'
              - 'apps/nav-snapshotter/**'
              - 'apps/sol-indexer/**'
              - 'apps/worker/**'
              - 'packages/agent-actions/**'
              - 'packages/agent-runtime/**'
              - 'packages/contracts-evm/**'
              - 'packages/database/**'
              - 'packages/db/**'
              - 'packages/fourmeme/**'
              - 'packages/launchpad/**'
              - 'packages/migrations/**'
              - 'packages/queue/**'
              - 'packages/redis/**'
              - 'packages/rpc/**'
              - 'packages/s3-uploader/**'
              - 'packages/sync/**'
            contracts:
              - 'packages/contracts-evm/**'
            frontend:
              - 'apps/frontend/**'
            shared:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.node.base.json'
              - 'biome.json'
              - 'packages/ai/**'
              - 'packages/blank/**'
              - 'packages/codex/**'
              - 'packages/config/**'
              - 'packages/constants/**'
              - 'packages/control-plane/**'
              - 'packages/flap/**'
              - 'packages/logger/**'
              - 'packages/metrics/**'
              - 'packages/programs/**'
              - 'packages/types/**'
              - 'packages/utils/**'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  api:
    name: API Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build API area
        # The api-area paths-filter triggers on apps/api, apps/worker,
        # apps/brain, apps/bundle-bot, apps/mcp, apps/sol-indexer,
        # apps/evm-indexer, apps/launch-indexer, apps/nav-snapshotter
        # plus packages/db, packages/agent-actions, packages/launchpad.
        # Every one of those needs to be in this filter so a breakage
        # anywhere api-flavored fails CI.
        # contracts-evm stays in this blocking API-area run, but only for
        # local/non-fork tests. Real BSC fork coverage is isolated below so
        # archive RPC quota/429s cannot false-red unrelated backend PRs.
        env:
          FORK_BSC: "false"
          REQUIRE_BSC_FORK: "false"
        run: >-
          bunx turbo run test build
          --filter='@waifufun/api...'
          --filter='@waifufun/worker...'
          --filter='@waifufun/brain...'
          --filter='@waifufun/bundle-bot...'
          --filter='@waifufun/mcp...'
          --filter='@waifufun/sol-indexer...'
          --filter='@waifufun/evm-indexer...'
          --filter='@waifufun/launch-indexer...'
          --filter='@waifufun/nav-snapshotter...'
          --filter='@waifufun/agent-actions...'
          --filter='@waifufun/db...'
          --filter='@waifufun/launchpad...'
          --filter='@waifufun/contracts-evm...'

  contracts-fork:
    name: Contracts BSC Fork Integration (advisory)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: BSC fork integration tests
        # Prefer BSC_FORK_RPC_URL (set this to the NodeReal/paid archive RPC)
        # and fall back to the legacy Alchemy secret until it is provisioned.
        env:
          FORK_BSC: ${{ (secrets.BSC_FORK_RPC_URL != '' || secrets.ALCHEMY_BSC_URL != '') && 'true' || 'false' }}
          FORK_BSC_URL: ${{ secrets.BSC_FORK_RPC_URL || secrets.ALCHEMY_BSC_URL }}
          # Wave M+N validated against this block (M5 verbose fork run + Nubs sim).
          # Bump quarterly to stay within provider cache windows; FLAP Portal evolves
          # state-side and old pinned blocks can trigger VanityAddressRequirementNotMet.
          FORK_BSC_BLOCK: "99073955"
          REQUIRE_BSC_FORK: ${{ (secrets.BSC_FORK_RPC_URL != '' || secrets.ALCHEMY_BSC_URL != '') && 'true' || 'false' }}
        run: bun run --filter @waifufun/contracts-evm test

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend area
        run: bunx turbo run test build --filter='@waifufun/frontend...'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.59.1

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: bunx playwright install --with-deps chromium

      - name: Playwright e2e
        # We do NOT pass PLAYWRIGHT_SKIP_BUILD here. NEXT_PUBLIC_* env
        # vars are inlined at build time, and our route-interception
        # patterns key off the test-only API host. The turbo build run
        # above uses production env, so we rebuild with the test env
        # via the playwright webServer command.
        working-directory: apps/frontend
        env:
          CI: "1"
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: apps/frontend/test-results/
          retention-days: 7
