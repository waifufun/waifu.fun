name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'apps/frontend/public/skill.md'
      - 'AGENT.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - 'README.md'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'apps/frontend/public/skill.md'
      - 'AGENT.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'apps/brain/**'
              - 'apps/evm-indexer/**'
              - 'apps/mcp/**'
              - 'apps/sol-indexer/**'
              - 'apps/worker/**'
              - 'packages/agent-actions/**'
              - 'packages/agent-runtime/**'
              - 'packages/contracts-evm/**'
              - 'packages/database/**'
              - 'packages/db/**'
              - 'packages/fourmeme/**'
              - 'packages/launchpad/**'
              - 'packages/migrations/**'
              - 'packages/queue/**'
              - 'packages/redis/**'
              - 'packages/rpc/**'
              - 'packages/s3-uploader/**'
              - 'packages/sync/**'
            frontend:
              - 'apps/frontend/**'
            shared:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.node.base.json'
              - 'biome.json'
              - 'packages/ai/**'
              - 'packages/blank/**'
              - 'packages/codex/**'
              - 'packages/config/**'
              - 'packages/constants/**'
              - 'packages/control-plane/**'
              - 'packages/flap/**'
              - 'packages/logger/**'
              - 'packages/metrics/**'
              - 'packages/programs/**'
              - 'packages/types/**'
              - 'packages/utils/**'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  api:
    name: API Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build API area
        # The api-area paths-filter triggers on apps/api, apps/worker,
        # apps/brain, apps/mcp, apps/sol-indexer, apps/evm-indexer plus
        # packages/db, packages/agent-actions, packages/launchpad. Every
        # one of those needs to be in this filter so a breakage anywhere
        # api-flavored fails CI. Round 1 codex caught worker / brain /
        # mcp / sol-indexer were missing.
        run: >-
          bunx turbo run test build
          --filter='@waifufun/api...'
          --filter='@waifufun/worker...'
          --filter='@waifufun/brain...'
          --filter='@waifufun/mcp...'
          --filter='@waifufun/sol-indexer...'
          --filter='@waifufun/evm-indexer...'
          --filter='@waifufun/agent-actions...'
          --filter='@waifufun/db...'
          --filter='@waifufun/launchpad...'

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Foundry
        # several packages spawn `anvil` to mock BSC fork tests; without
        # foundry installed those tests fail with `spawn anvil ENOENT`.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build frontend area
        run: bunx turbo run test build --filter='@waifufun/frontend...'
