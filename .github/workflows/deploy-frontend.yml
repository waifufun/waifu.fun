name: Deploy Frontend (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'
      - 'packages/constants/**'
      - 'packages/config/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Pages branch to deploy to (production = main, anything else is a preview)
        required: false
        default: main

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_HOST: ${{ vars.NEXT_PUBLIC_HOST }}
          NEXT_PUBLIC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_PROJECT_ID }}
          NEXT_PUBLIC_DECIMALS: ${{ vars.NEXT_PUBLIC_DECIMALS }}
          NEXT_PUBLIC_TOKEN_SUPPLY: ${{ vars.NEXT_PUBLIC_TOKEN_SUPPLY }}
          NEXT_PUBLIC_VIRTUAL_RESERVES: ${{ vars.NEXT_PUBLIC_VIRTUAL_RESERVES }}
          NEXT_PUBLIC_NETWORK: ${{ vars.NEXT_PUBLIC_NETWORK }}
          NEXT_PUBLIC_LAUNCHPAD_PICKER_ENABLED: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_PICKER_ENABLED }}
          NEXT_PUBLIC_GENERATION_IMAGE_MIN_BALANCE: ${{ vars.NEXT_PUBLIC_GENERATION_IMAGE_MIN_BALANCE }}
          NEXT_PUBLIC_GENERATION_IMAGE_MIN_BALANCE_FAST: ${{ vars.NEXT_PUBLIC_GENERATION_IMAGE_MIN_BALANCE_FAST }}
          NEXT_PUBLIC_GENERATION_VIDEO_MIN_BALANCE: ${{ vars.NEXT_PUBLIC_GENERATION_VIDEO_MIN_BALANCE }}
          NEXT_PUBLIC_GENERATION_VIDEO_MIN_BALANCE_FAST: ${{ vars.NEXT_PUBLIC_GENERATION_VIDEO_MIN_BALANCE_FAST }}
          NEXT_PUBLIC_HELIUS_API_KEY: ${{ secrets.NEXT_PUBLIC_HELIUS_API_KEY }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          command: pages deploy out --project-name=waifu-fun --branch=${{ github.event.inputs.branch || github.ref_name }}
