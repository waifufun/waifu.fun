name: Reusable — Docker build

on:
  workflow_call:
    inputs:
      push_images:
        description: Whether to push images to GHCR
        required: true
        type: boolean
      use_latest_tag_only:
        description: If true, tag each image as latest only; if false, use docker/metadata-action (branch, sha, semver)
        required: true
        type: boolean
      cache_scope_suffix:
        description: Suffix for GHA cache scope (empty = service name only)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            service_name: api
          - service: worker
            service_name: worker
          - service: indexer
            service_name: evm-indexer
          - service: brain
            service_name: brain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ inputs.use_latest_tag_only != true }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compute cache scope
        id: cache
        shell: bash
        run: |
          suffix="${{ inputs.cache_scope_suffix }}"
          svc="${{ matrix.service }}"
          if [[ -n "$suffix" ]]; then
            echo "scope=${svc}-${suffix}" >> "$GITHUB_OUTPUT"
          else
            echo "scope=${svc}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (metadata tags)
        if: ${{ inputs.use_latest_tag_only != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.waifu-core
          target: runner
          build-args: |
            SERVICE_NAME=${{ matrix.service_name }}
          push: ${{ inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.cache.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.scope }}
          provenance: false

      - name: Build and push (latest only)
        if: ${{ inputs.use_latest_tag_only == true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.waifu-core
          target: runner
          build-args: |
            SERVICE_NAME=${{ matrix.service_name }}
          push: ${{ inputs.push_images }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ steps.cache.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.scope }}
          provenance: false
