name: cf-deploy

# Cloudflare Pages deployment for the waifu.fun frontend.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/cf-deploy.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/cf-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend
        run: pnpm --filter @waifufun/frontend typecheck

      - name: Build Frontend for Cloudflare Pages
        run: pnpm --filter @waifufun/frontend build:cf
        env:
          NEXT_PUBLIC_API_URL: https://api.waifu.fun
          NEXT_PUBLIC_STEWARD_API_URL: https://eliza.steward.fi
          NEXT_PUBLIC_STEWARD_TENANT_ID: waifu
          NEXT_PUBLIC_LAUNCHPAD_PICKER_ENABLED: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - name: Resolve Pages branch
        id: pages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deploy .open-next/assets \
            --project-name=waifu-fun \
            --branch=${{ steps.pages.outputs.branch }}
