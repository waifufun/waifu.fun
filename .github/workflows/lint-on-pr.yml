name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write # Needed to push fixes

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
  
          # Check if there are any staged or unstaged changes
          if ! git diff --quiet && ! git diff --staged --quiet; then
            echo "Linting made changes. Committing and pushing..."
            git add . # Stage all changes made by the linter
            git commit -m "chore(lint): auto-fix lint issues"
            # Push to the same branch the PR is from
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No lint changes to commit."
          fi
