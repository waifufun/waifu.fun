name: Validate PR Source Branch

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  restrict-pr-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR from $HEAD_REF to $BASE_REF"

          if [[ "$BASE_REF" == "staging" && "$HEAD_REF" != "develop" ]]; then
            echo "❌ Pull requests to 'staging' must come from 'develop'"
            exit 1
          fi

          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "staging" ]]; then
            echo "❌ Pull requests to 'main' must come from 'staging'"
            exit 1
          fi

          echo "✅ PR source branch is valid"
