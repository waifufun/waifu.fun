name: Validate PR Source Branch

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  restrict-pr-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check source branch
        run: |
          echo "PR from ${{ github.head_ref }} to ${{ github.base_ref }}"

          if [[ "${{ github.base_ref }}" == "staging" && "${{ github.head_ref }}" != "develop" ]]; then
            echo "❌ Pull requests to 'staging' must come from 'develop'"
            exit 1
          fi

          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "staging" ]]; then
            echo "❌ Pull requests to 'main' must come from 'staging'"
            exit 1
          fi

          echo "✅ PR source branch is valid"
