name: Frontend - Build Image and Deploy

on:
   push:
      branches:
         - develop
         - staging
         - main

env:
   NORTHFLANK_PROJECT_ID: autofun
   NORTHFLANK_CREDENTIALS_ID: "dockerhub"

jobs:
   build-and-deploy:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write

      steps:
         - name: Checkout repository
           uses: actions/checkout@v3

         - name: Log in to Docker Hub
           uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Extract metadata (tags, labels) for Docker
           id: meta
           uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
           with:
              images: autofun/autofun-frontend
              tags: |
                type=raw,value=${{ github.ref_name }}

         - name: Build and push Docker image
           uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
           with:
              context: .
              file: ./apps/frontend/Dockerfile.frontend
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}

         - name: Set Northflank Service ID
           id: northflank_service
           run: |
             BRANCH_NAME=${{ github.ref_name }}
             if [ "$BRANCH_NAME" == "develop" ]; then
               echo "SERVICE_ID=develop-frontend" >> $GITHUB_ENV
             elif [ "$BRANCH_NAME" == "staging" ]; then
               echo "SERVICE_ID=staging-frontend" >> $GITHUB_ENV
             elif [ "$BRANCH_NAME" == "main" ]; then
               echo "SERVICE_ID=production-frontend" >> $GITHUB_ENV
             else
               echo "Unsupported branch for Northflank deployment: $BRANCH_NAME"
               exit 1
             fi

         - name: Deploy to Northflank
           uses: northflank/deploy-to-northflank@v1
           with:
              northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
              project-id: ${{ env.NORTHFLANK_PROJECT_ID }}
              service-id: ${{ env.SERVICE_ID }} # SERVICE_ID is now in GITHUB_ENV
              image-path: ${{ steps.meta.outputs.tags }} # This will be autofun/autofun-frontend:<branch_name>
              credentials-id: ${{ env.NORTHFLANK_CREDENTIALS_ID }}
