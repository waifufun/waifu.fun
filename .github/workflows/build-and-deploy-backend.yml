name: Backend - Build Image and Deploy

on:
  push:
    branches:
      - develop
      - staging
      - main

env:
  NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID || 'autofun' }}
  NORTHFLANK_CREDENTIALS_ID: ${{ vars.NORTHFLANK_CREDENTIALS_ID || 'dockerhub' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/waifufun-backend
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set Northflank Service ID
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          if [ "$BRANCH_NAME" = "develop" ]; then
            echo "SERVICE_ID=${{ vars.NORTHFLANK_DEVELOP_BACKEND_SERVICE_ID || 'develop-backend' }}" >> "$GITHUB_ENV"
          elif [ "$BRANCH_NAME" = "staging" ]; then
            echo "SERVICE_ID=${{ vars.NORTHFLANK_STAGING_BACKEND_SERVICE_ID || 'staging-backend' }}" >> "$GITHUB_ENV"
          elif [ "$BRANCH_NAME" = "main" ]; then
            echo "SERVICE_ID=${{ vars.NORTHFLANK_PRODUCTION_BACKEND_SERVICE_ID || 'production-backend' }}" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch for Northflank deployment: $BRANCH_NAME"
            exit 1
          fi

      - name: Deploy to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ env.NORTHFLANK_PROJECT_ID }}
          service-id: ${{ env.SERVICE_ID }}
          image-path: ${{ steps.meta.outputs.tags }}
          credentials-id: ${{ env.NORTHFLANK_CREDENTIALS_ID }}
