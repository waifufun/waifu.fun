name: Backend - Build Image

on:
   push:
      branches:
         - develop
         - staging
         - production

jobs:
   build:
      runs-on: self-hosted
      permissions:
         contents: read
         packages: write

      steps:
         # Step 1 - Checkout the repository containing our application's source code.
         - name: Checkout repository
           uses: actions/checkout@v3

         # Step 2 - Authenticate with Docker Hub.
         - name: Log in to Docker Hub
           uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}


         # Step 3 - Extract metadata (tags, labels) for Docker.
         # This will tag the image as <dockerhub_username>/<repository_name>:<branch_name>.
         - name: Extract metadata (tags, labels) for Docker
           id: meta
           uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
           with:
              images: autofun/autofun-backend
              tags: |
                type=raw,value=${{ github.ref_name }}

         # Step 4 - Build the Docker image and push it to the container registry we previously authenticated with.
         - name: Build and push Docker image
           uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
           with:
              context: .
              file: ./apps/backend/Dockerfile.backend
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}