name: waifufun-indexer

services:
  postgres:
    image: postgres:15
    container_name: waifufun-indexer-postgres
    environment:
      POSTGRES_DB: "${INDEXER_DB_NAME:-waifufun_indexer}"
      POSTGRES_USER: "${INDEXER_DB_USER:-indexer}"
      POSTGRES_PASSWORD: "${INDEXER_DB_PASS:-indexer_dev}"
    ports:
      - "${INDEXER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
