services:
  frontend:
      build:
       context: .
       dockerfile: apps/frontend/Dockerfile.frontend
      ports:
        - "3000:3000"
      volumes:
        - .:/app
        - /app/node_modules
      environment:
        - NODE_ENV=development

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.backend
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  dragonfly:
    container_name: autofun-dragonfly
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    network_mode: "host"
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - "dragonfly-data:/data"

  minio:
    image: minio/minio
    container_name: autofun-minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./scripts/init-minio.sh:/init-minio.sh
    entrypoint: >
      /bin/sh -c "
      /init-minio.sh &
      /usr/bin/docker-entrypoint.sh minio server /data --console-address :9001
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      
  mongo1:
    container_name: autofun-mongo1
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017',priority:1},{_id:1,host:'host.docker.internal:27018',priority:0.5},{_id:2,host:'host.docker.internal:27019',priority:0.5}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "mongo1_data:/data/db"
      - "mongo1_config:/data/configdb"

  mongo2:
    container_name: autofun-mongo2
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - 27018:27018
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "mongo2_data:/data/db"
      - "mongo2_config:/data/configdb"

  mongo3:
    container_name: autofun-mongo3
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - 27019:27019
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "mongo3_data:/data/db"
      - "mongo3_config:/data/configdb"
      
  datadog-agent:
    image: datadog/agent:latest
    container_name: datadog-agent
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=datadoghq.eu
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=false
      - DD_LOGS_CONFIG_USE_HTTP=false
      - DD_HOSTNAME=autofun-host
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - ./apps/backend/logs:/var/log/fastify:rw
      - ./datadog/conf.d:/etc/datadog-agent/conf.d:ro
      - ./datadog/datadog.yaml:/etc/datadog-agent/datadog.yaml:ro
    entrypoint: ["/opt/datadog-agent/bin/agent/agent", "run"]
      
networks:
  app-network:
    driver: bridge

volumes:
  dragonfly-data:
    driver: local
  mongo1_data:
  mongo2_data:
  mongo3_data:
  mongo1_config:
  mongo2_config:
  mongo3_config:
  minio-data:
