version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: autofun-indexer-postgres
    environment:
      POSTGRES_DB: "${INDEXER_DB_NAME}"
      POSTGRES_USER: "${INDEXER_DB_USER}"
      POSTGRES_PASSWORD: "${INDEXER_DB_PASS}"
    ports:
      - "${INDEXER_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: