name = "waifu-service"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WaifuService", "WaifuBackgroundService"]

[env.worker]
name = "waifu-worker-production"

[env.worker.vars]
SERVICE_NAME = "worker"
SERVICE_ENABLED = "false"

[env.worker.triggers]
crons = ["* * * * *"]

[[env.worker.containers]]
class_name = "WaifuBackgroundService"
image = "Dockerfile"
image_build_context = "."
max_instances = 1
instance_type = "standard-1"

[env.worker.containers.image_vars]
RUNTIME_IMAGE = "ghcr.io/waifufun/waifu.fun-worker@sha256:1be87437244e1aaddc940375787bf14622c7b117f4c7590f847f941852db7875"

[[env.worker.durable_objects.bindings]]
name = "SERVICE"
class_name = "WaifuBackgroundService"

